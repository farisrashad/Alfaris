<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كتالوج مصنع الفارس للمراتب</title>
<meta name="description" content="كتالوج مصنع الفارس للمراتب والإسفنج — مراتب طبي وسوست وسوفت ومخدات وكثرات.">
<meta name="theme-color" content="#0a2166">
<link rel="icon" href="../logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --blue-1:#112f86; --blue-2:#0a2166; --blue-3:#06174d; --blue-4:#030b2f;
    --cyan:#2fd6f7; --glass:rgba(255,255,255,.09); --glass-line:rgba(255,255,255,.22);
    --text:#fff; --muted:rgba(255,255,255,.74);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{background:var(--blue-4)}
  body{
    min-height:100vh;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;color:var(--text);
    background:radial-gradient(90% 55% at 50% 10%, var(--blue-1), var(--blue-2) 55%, var(--blue-3) 85%, var(--blue-4));
    background-attachment:fixed;
    padding:max(12px,env(safe-area-inset-top)) clamp(12px,3vw,28px) max(24px,env(safe-area-inset-bottom));
  }
  main{width:100%;max-width:1100px;margin-inline:auto}

  /* ---------- الهيدر ---------- */
  header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  header .back{
    flex:none;display:flex;align-items:center;gap:4px;padding:8px 12px;border-radius:12px;
    background:var(--glass);border:1px solid var(--glass-line);color:#fff;text-decoration:none;font-size:.85rem;font-weight:600;
  }
  header .back svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  header h1{flex:1;text-align:center;font-family:"Reem Kufi",sans-serif;font-weight:500;font-size:1.2rem}
  header img{width:44px;height:auto;flex:none}

  /* ---------- بحث + أقسام ---------- */
  .search{
    width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--glass-line);
    background:var(--glass);color:#fff;font:inherit;font-size:.95rem;outline:none;
  }
  .search::placeholder{color:var(--muted)}
  .search:focus{border-color:var(--cyan)}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 0 12px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:none;padding:7px 14px;border-radius:999px;border:1px solid var(--glass-line);
    background:var(--glass);color:#fff;font:inherit;font-size:.88rem;font-weight:600;cursor:pointer;
    transition:background .2s,color .2s,border-color .2s;
  }
  .tab[aria-pressed="true"]{background:#fff;color:#08206b;border-color:#fff}

  /* ---------- كروت المنتجات ---------- */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media (min-width:700px){ .grid{grid-template-columns:repeat(3,1fr);gap:14px} }
  @media (min-width:1000px){ .grid{grid-template-columns:repeat(4,1fr)} }

  .card{
    display:flex;flex-direction:column;border-radius:16px;overflow:hidden;
    background:var(--glass);border:1px solid var(--glass-line);
  }
  .pic{position:relative;aspect-ratio:4/3;background:rgba(3,11,47,.5);display:grid;place-items:center}
  .pic img.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .pic img.ph{width:32%;opacity:.35}
  .body{display:flex;flex-direction:column;gap:6px;padding:10px 10px 12px;flex:1}
  .cat{font-size:.72rem;color:var(--cyan);font-weight:600}
  .name{font-size:.95rem;font-weight:700;line-height:1.35}
  .meta{font-size:.78rem;color:var(--muted)}
  .desc{font-size:.8rem;color:var(--muted);line-height:1.5}
  .sizes{display:flex;flex-wrap:wrap;gap:5px}
  .size{
    padding:4px 8px;border-radius:8px;border:1px solid var(--glass-line);background:transparent;color:#fff;
    font:inherit;font-size:.74rem;cursor:pointer;direction:ltr;
  }
  .size[aria-pressed="true"]{background:var(--cyan);border-color:var(--cyan);color:#04202a;font-weight:700}
  .price{font-weight:700;font-size:.95rem}
  .order{
    margin-top:auto;display:flex;align-items:center;justify-content:center;gap:7px;
    padding:9px 8px;border-radius:12px;text-decoration:none;font-weight:700;font-size:.85rem;color:#04230f;
    background:linear-gradient(180deg,#43e97b,#25D366 60%,#1aa84f);
  }
  .order svg{width:18px;height:18px}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}
  @media (hover:hover){.tab:hover{background:rgba(255,255,255,.16)}.tab[aria-pressed="true"]:hover{background:#fff}.order:hover{filter:brightness(1.06)}}
  a:focus-visible,button:focus-visible{outline:2px solid #fff;outline-offset:2px}
  footer{margin-top:22px;text-align:center;color:var(--muted);font-size:.74rem}
</style>
</head>
<body>
<main>
  <header>
    <a class="back" href="../">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>الرئيسية
    </a>
    <h1>كتالوج مصنع الفارس</h1>
    <img src="../logo.png" alt="" width="701" height="952">
  </header>

  <input class="search" id="q" type="search" placeholder="ابحث عن منتج..." aria-label="بحث">
  <div class="tabs" id="tabs" role="group" aria-label="الأقسام"></div>
  <section class="grid" id="grid" aria-live="polite"></section>

  <footer>© مصنع الفارس للمراتب</footer>
</main>

<script src="products.js"></script>
<script>
const WA_ICON = `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#04230f" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52s.198-.298.298-.497c.099-.198.05-.371-.025-.52s-.669-1.612-.916-2.207c-.242-.579-.487-.5-.669-.51a13 13 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074s2.096 3.2 5.077 4.487c.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413s.248-1.289.173-1.413c-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.82 9.82 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.82 11.82 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.9 11.9 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.82 11.82 0 0 0-3.48-8.413"/></svg>`;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const catName = id => (CATALOG.categories.find(c => c.id === id) || {}).name || "";

const state = { cat: "all", q: "", pick: {} };   // pick = المقاس المختار لكل منتج
const grid = document.getElementById("grid");
const tabs = document.getElementById("tabs");

function waLink(p, i) {
  const size = state.pick[i];
  let msg = `أهلاً، عايز أستفسر عن: ${p.name}`;
  if (size) msg += ` — مقاس ${size}`;
  return `https://wa.me/${CATALOG.whatsapp}?text=${encodeURIComponent(msg)}`;
}

function renderTabs() {
  const used = CATALOG.categories.filter(c => CATALOG.products.some(p => p.cat === c.id));
  const all = [{ id: "all", name: "الكل" }, ...used];
  tabs.innerHTML = all.map(c =>
    `<button class="tab" data-cat="${esc(c.id)}" aria-pressed="${state.cat === c.id}">${esc(c.name)}</button>`).join("");
}

function renderGrid() {
  const q = state.q.trim().toLowerCase();
  const list = CATALOG.products
    .map((p, i) => ({ p, i }))
    .filter(({ p }) => (state.cat === "all" || p.cat === state.cat) &&
      (!q || (p.name + " " + (p.desc || "")).toLowerCase().includes(q)));

  if (!list.length) { grid.innerHTML = `<p class="empty">مفيش منتجات مطابقة</p>`; return; }

  grid.innerHTML = list.map(({ p, i }) => `
    <article class="card">
      <div class="pic">
        <img class="ph" src="../logo.png" alt="">
        ${p.image ? `<img class="photo" src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy" onerror="this.remove()">` : ""}
      </div>
      <div class="body">
        <span class="cat">${esc(catName(p.cat))}</span>
        <h2 class="name">${esc(p.name)}</h2>
        ${p.thickness ? `<span class="meta">السُمك: ${esc(p.thickness)}</span>` : ""}
        ${p.desc ? `<p class="desc">${esc(p.desc)}</p>` : ""}
        ${(p.sizes || []).length ? `<div class="sizes" data-i="${i}">${p.sizes.map(s =>
          `<button class="size" data-size="${esc(s)}" aria-pressed="${state.pick[i] === s}">${esc(s)}</button>`).join("")}</div>` : ""}
        ${p.price ? `<span class="price">${esc(p.price)}</span>` : ""}
        <a class="order" data-i="${i}" href="${waLink(p, i)}" target="_blank" rel="noopener">${WA_ICON}اطلب واتساب</a>
      </div>
    </article>`).join("");
}

tabs.addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b) return;
  state.cat = b.dataset.cat; renderTabs(); renderGrid();
});
document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; renderGrid(); });

grid.addEventListener("click", e => {
  const b = e.target.closest(".size"); if (!b) return;
  const i = b.parentElement.dataset.i;
  state.pick[i] = state.pick[i] === b.dataset.size ? "" : b.dataset.size;   // ضغطة تانية تلغي الاختيار
  b.parentElement.querySelectorAll(".size").forEach(x => x.setAttribute("aria-pressed", x.dataset.size === state.pick[i]));
  b.closest(".card").querySelector(".order").href = waLink(CATALOG.products[i], i);
});

renderTabs(); renderGrid();
</script>
</body>
</html>
